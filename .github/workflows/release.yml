name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.0.0)"
        required: true
        default: manual

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish web and BFF images to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/web:latest
          build-args: |
            BFF_URL=http://bff:4001
            SITE_URL=https://sharik-alomr.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push BFF
        uses: docker/build-push-action@v6
        with:
          context: ./bff
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bff:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/bff:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
