name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          BFF_URL: http://127.0.0.1:4001
          SITE_URL: https://sharik-alomr.com
          NEXT_TELEMETRY_DISABLED: "1"

  bff:
    name: BFF — typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bff/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://sharik:sharik@127.0.0.1:5432/sharik_test?schema=public
          WEB_SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [web, bff]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sharik-alomr-web:ci
          build-args: |
            BFF_URL=http://bff:4001
            SITE_URL=https://sharik-alomr.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build BFF image
        uses: docker/build-push-action@v6
        with:
          context: ./bff
          push: false
          tags: sharik-alomr-bff:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
